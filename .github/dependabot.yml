version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # pgrx and pgrx-tests are pinned with `=` and must be bumped together
      # with cargo-pgrx and the packaging workflow. Keep those manual.
      - dependency-name: pgrx
      - dependency-name: pgrx-tests

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
