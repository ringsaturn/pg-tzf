[package]
name = "tzf"
version = "0.3.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[package.metadata.pgrx]
pg_version = 16
sql-generator = true

[features]
default = []
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = ["dep:cities-json"]

[dependencies]
cities-json = { version = "0.6.8", optional = true }
lazy_static = "1.5.0"
pgrx = "=0.20.1"
tzf-rs = "2.0.0"

[dev-dependencies]
pgrx-tests = "=0.20.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
